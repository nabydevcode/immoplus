# Répartiteur du profil « echelle » : sert le build React et répartit /api/ entre les 2 instances de l'API.
# Même organisation que la future production (VPS) : le client appelle /api, nginx retire le préfixe.
# Écoute dans le conteneur sur 80, publiée sur 127.0.0.1:8088 uniquement (voir docker-compose.yml).

# Résolveur DNS de Docker : les adresses des instances sont relues si un conteneur redémarre (directive « resolve »).
resolver 127.0.0.11 valid=10s ipv6=off;

# Requêtes HTTP ordinaires : tourniquet (round-robin) entre les instances ; une instance qui ne répond pas est
# écartée 10 s et la requête est rejouée sur l'autre (seulement si elle n'est pas POST/PATCH : proxy_next_upstream).
upstream api_immoplus {
    zone api_immoplus 64k;
    server api-echelle-1:8080 resolve max_fails=2 fail_timeout=10s;
    server api-echelle-2:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# SignalR (/api/hubs/…) : la négociation (POST …/negotiate, jeton dans l'en-tête Authorization) et la connexion
# WebSocket qui suit (jeton dans ?access_token=) doivent arriver sur la MÊME instance, sinon l'identifiant de
# connexion est inconnu (404). Affinité par jeton : un même utilisateur connecté reste sur la même instance,
# des utilisateurs différents se répartissent ; le backplane Redis relaie les messages entre instances.
upstream api_immoplus_hubs {
    zone api_immoplus_hubs 64k;
    hash $cle_affinite_hub consistent;
    server api-echelle-1:8080 resolve max_fails=2 fail_timeout=10s;
    server api-echelle-2:8080 resolve max_fails=2 fail_timeout=10s;
}

map $http_authorization $jeton_entete {
    "~^Bearer\s+(?<jeton>\S+)$" $jeton;
    default "";
}
map $arg_access_token $cle_affinite_hub {
    ""      $jeton_entete;
    default $arg_access_token;
}

# Cache des photos PUBLIQUES d'annonces (et miniatures) : nginx garde la réponse tant que l'API l'autorise
# (Cache-Control: public, max-age=86400) ; les photos protégées (« private, no-store ») ne sont jamais mises en cache.
# Les instances ne sont plus sollicitées (base + S3) pour ces fichiers, qui représentent ~40 % des requêtes du site.
proxy_cache_path /var/cache/nginx/photos levels=1:2 keys_zone=photos:10m max_size=1g inactive=7d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Identifiant de corrélation : celui du client s'il en envoie un (l'API ne le reprend que s'il est sûr), sinon un
# identifiant généré par nginx ; transmis à l'API (X-Correlation-Id) et écrit dans le journal nginx pour relier les deux.
map $http_x_correlation_id $id_correlation {
    ""      $request_id;
    default $http_x_correlation_id;
}

# Journal : on voit quelle instance a servi chaque requête (sans la chaîne de requête, qui peut contenir le jeton).
log_format echelle '$remote_addr [$time_local] "$request_method $uri" $status -> $upstream_addr ${request_time}s cid=$id_correlation';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log echelle;

    # Pièces d'identité : recto + verso jusqu'à 10 Mo chacun.
    client_max_body_size 25m;

    root /usr/share/nginx/html;

    # Instance qui a répondu (pour vérifier la répartition depuis le navigateur ou curl -I).
    add_header X-Instance-Api $upstream_addr always;
    add_header X-Content-Type-Options nosniff always;

    # Métriques Prometheus : jamais publiées par nginx (Prometheus les lit directement sur le réseau Docker). Sans ce
    # blocage, /api/metriques arriverait à l'API depuis une adresse privée (passerelle Docker) et serait accepté sans jeton.
    location ~* ^/api/+metriques(/|$) {
        return 404;
    }

    location /api/hubs/ {
        proxy_pass http://api_immoplus_hubs/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $id_correlation;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Photos d'annonces : /api/appartement/photo/{n°}[?taille=miniature] (clé de cache = adresse complète).
    location ~ ^/api/appartement/photo/[0-9]+$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_immoplus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $id_correlation;
        proxy_cache photos;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://api_immoplus/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $id_correlation;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Fichiers du build Vite avec empreinte dans le nom : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Application React (routage côté client) : toute autre adresse renvoie index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
