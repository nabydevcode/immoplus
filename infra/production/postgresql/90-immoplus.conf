# Réglages PostgreSQL pour le VPS partagé (4 Go de RAM, 1 vCPU : ImmoPlus + financement + PostgreSQL).
# Installé dans /etc/postgresql/18/main/conf.d/90-immoplus.conf.
# Rechargés sans coupure (« SELECT pg_reload_conf() ») sauf shared_buffers, appliqué au prochain redémarrage de
# PostgreSQL (redémarrage du serveur ou « systemctl restart postgresql » planifié : coupe aussi financement quelques secondes).

# Connexions : ImmoPlus 20 au plus (BaseDeDonnees__TaillePoolMax=20) + financement + maintenance ; 100 par défaut, gardé.
max_connections = 100

# Mémoire
shared_buffers = 384MB          # au prochain redémarrage (128 Mo jusque-là, largement suffisant pour une base vide)
effective_cache_size = 1536MB   # estimation du cache disque du système (le défaut du serveur, 4 Go, dépassait la RAM)
work_mem = 8MB
maintenance_work_mem = 128MB

# Disque SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Journal des requêtes lentes (> 500 ms) pour repérer les goulots
log_min_duration_statement = 500
