# Site nginx d'ImmoPlus sur le VPS (version légère : 1 instance de l'API sur 127.0.0.1:5050, client React statique).
# Installé dans /etc/nginx/sites-available/immoplus (lien dans sites-enabled), avec le fichier commun
# /etc/nginx/snippets/immoplus-commun.conf (toutes les « location »).
#
# Deux portes d'entrée, même contenu :
#   - http://immoplus.cloud et http://www.immoplus.cloud (port 80, choisi par le nom de domaine) ;
#     certbot y ajoute ensuite le bloc HTTPS (443) et la redirection HTTP -> HTTPS ;
#   - http://168.231.77.68:8081 (accès par l'IP en attendant le DNS). Le port 80 « par l'IP » appartient à l'ancien
#     projet financement-api (server_name 168.231.77.68) et n'est PAS modifié.
#
# Rien ici ne doit toucher à financement-api (port 5000, site nginx « financement-api »).

upstream immoplus_api {
    server 127.0.0.1:5050 max_fails=0;
    keepalive 16;
}

# Cache des photos PUBLIQUES d'annonces et de leurs miniatures (l'API répond « Cache-Control: public, max-age=86400 ») ;
# les photos protégées (« private, no-store ») ne sont jamais gardées.
proxy_cache_path /var/cache/nginx/immoplus-photos levels=1:2 keys_zone=immoplus_photos:10m max_size=1g inactive=7d use_temp_path=off;

map $http_upgrade $immoplus_connection_upgrade {
    default upgrade;
    ""      "";
}

# Identifiant de corrélation : celui du client s'il en envoie un (l'API ne le reprend que s'il est sûr), sinon un
# identifiant généré par nginx ; transmis à l'API (X-Correlation-Id) et écrit dans le journal nginx.
map $http_x_correlation_id $immoplus_cid {
    ""      $request_id;
    default $http_x_correlation_id;
}

# Journal sans la chaîne de requête (SignalR y place le jeton d'accès : ?access_token=…).
log_format immoplus '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s cid=$immoplus_cid';

# Accès par le nom de domaine (port 80). Après certbot, ce bloc ne fait plus que rediriger vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name immoplus.cloud www.immoplus.cloud;

    include /etc/nginx/snippets/immoplus-commun.conf;
}

# Accès par l'IP : http://168.231.77.68:8081 (remplace l'ancien client Blazor). À fermer quand HTTPS est en place
# (sinon mots de passe et jetons y circulent en clair) : supprimer ce bloc puis « nginx -t && systemctl reload nginx ».
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    include /etc/nginx/snippets/immoplus-commun.conf;
}
