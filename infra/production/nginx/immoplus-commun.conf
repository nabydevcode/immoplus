# Partie commune aux blocs « server » d'ImmoPlus (inclus par /etc/nginx/sites-available/immoplus).
# Installé dans /etc/nginx/snippets/immoplus-commun.conf.

server_tokens off;
access_log /var/log/nginx/immoplus.access.log immoplus;
error_log /var/log/nginx/immoplus.error.log;

# Pièces d'identité : recto + verso jusqu'à 10 Mo chacun.
client_max_body_size 25m;

root /var/www/immoplus-react;
index index.html;

# Compression des fichiers texte du client (les réponses de l'API sont déjà compressées par l'API elle-même).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

include /etc/nginx/snippets/immoplus-securite.conf;

# Métriques Prometheus : jamais publiées par nginx (elles arriveraient à l'API depuis 127.0.0.1, donc acceptées sans
# jeton). Lecture locale uniquement : curl -H "Authorization: Bearer $Metriques__Jeton" http://127.0.0.1:5050/metriques
location ~* ^/api/+metriques(/|$) {
    return 404;
}

# Temps réel SignalR (/api/hubs/messages) : WebSockets, connexions longues, pas de tampon.
location /api/hubs/ {
    proxy_pass http://immoplus_api/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $immoplus_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $immoplus_cid;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

# Photos d'annonces : /api/appartement/photo/{n°}[?taille=miniature] (clé de cache = adresse complète).
location ~ ^/api/appartement/photo/[0-9]+$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://immoplus_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $immoplus_cid;
    proxy_cache immoplus_photos;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_502 http_503;
    add_header X-Cache $upstream_cache_status always;
    include /etc/nginx/snippets/immoplus-securite.conf;
}

# API : /api/xxx -> http://127.0.0.1:5050/xxx (préfixe retiré par le « / » final de proxy_pass).
location /api/ {
    proxy_pass http://immoplus_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $immoplus_cid;
    proxy_read_timeout 120s;
}

# Fichiers du build Vite avec empreinte dans le nom : cache long.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/immoplus-securite.conf;
    try_files $uri =404;
}

# Application React (routage côté client) : toute autre adresse renvoie index.html, jamais mis en cache.
location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/immoplus-securite.conf;
    try_files $uri /index.html;
}
